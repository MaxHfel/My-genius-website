<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | My Genius: Startups</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f7fa;
      color: #222;
      line-height: 1.6;
    }

    /* Navigation bar */
    nav {
      background-color: #1a1a1a;
      padding: 14px 20px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 14px;
      font-weight: bold;
    }
    nav a:hover,
    nav a.active {
      text-decoration: underline;
    }

    header {
      background-color: #2a2a2a;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }
    header h1 {
      margin: 0;
      font-size: 2.6em;
    }
    header p {
      margin-top: 10px;
      font-size: 1.2em;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    section {
      background-color: white;
      border-radius: 10px;
      padding: 20px 30px;
      margin: 25px 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #2a2a2a;
    }

    /* Image + contact info side by side */
    .contact-box {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: center;
    }
    .contact-box img {
      width: 260px;
      height: 260px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px dashed #b0bec5;   /* remove once ive added the real images */
      background-color: #fafafa;
    }
    .contact-info {
      flex: 1;
      min-width: 250px;
    }
    .contact-info p {
      margin: 10px 0;
    }
    .contact-info a {
      color: #555555;
      font-weight: bold;
    }

    .email-button {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #2a2a2a;
      color: white !important;
      text-decoration: none;
      border-radius: 6px;
    }
    .email-button:hover {
      background-color: #555555;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="resource.html">Resources</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <header>
    <h1>Contact</h1>
    <p>Want to talk startups? Reach out!</p>
  </header>

  <main>

    <section>
      <h2>Get in Touch</h2>
      <div class="contact-box">
        <!-- Replace with your own image -->
        <img src="images/contact.jpg" alt="Contact image">

        <div class="contact-info">
          

          <!-- mailto link: opens the visitor's email app -->
          <p><strong>Email:</strong>
            <a href="mailto:mholzapfel@eastsideprep.org">mholzapfel@eastsideprep.org</a>
          </p>

          <p><strong>School:</strong> Eastside Preparatory School</p>
          <p><strong>Address:</strong> [EPS address]</p>
          <p><strong>Phone:</strong> [EPS phone number]</p>

          <a class="email-button" href="mailto:mholzapfel@eastsideprep.org">Send me an email</a>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Max Holzapfel | Eastside Preparatory School</p>
  </footer>

</body>
</html>
